<!DOCTYPE html>
<html lang="en">
<head>
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card-header { background-color: #007bff; color: white; }
        .form-label { font-weight: bold; }
        .btn-primary { background-color: #007bff; border-color: #007bff; }
        .btn-success { background-color: #28a745; border-color: #28a745; }
        .logo { max-width: 100px; }
        .result { margin-top: 20px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="text-center mb-4">
            <img src="https://file.hutech.edu.vn/file/editor/homepage/stories/hinhsay/logo28CHKVK-81.png" alt="Hutech Logo" class="logo">
            <h2 class="mt-3">CAESAR CIPHER</h2>
        </div>
        <div class="card p-4">
            <h4 class="card-header">ENCRYPTION</h4>
            <div class="card-body">
                <form method="POST" action="/encrypt">
                    <div class="mb-3">
                        <label class="form-label">Plain text:</label>
                        <input type="text" class="form-control" name="inputPlainText" placeholder="Input Plain Text" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Key:</label>
                        <input type="number" class="form-control" name="inputKeyPlain" placeholder="Input Key" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Encrypt</button>
                </form>
                {% if encrypted_text %}
                <div class="result">
                    <strong>Encrypted Text:</strong> {{ encrypted_text }}
                </div>
                {% endif %}
            </div>
        </div>
        <div class="card p-4 mt-4">
            <h4 class="card-header">DECRYPTION</h4>
            <div class="card-body">
                <form method="POST" action="/decrypt">
                    <div class="mb-3">
                        <label class="form-label">Cipher text:</label>
                        <input type="text" class="form-control" name="inputCipherText" placeholder="Input Cipher Text" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Key:</label>
                        <input type="number" class="form-control" name="inputKeyCipher" placeholder="Input Key" required>
                    </div>
                    <button type="submit" class="btn btn-success">Decrypt</button>
                </form>
                {% if decrypted_text %}
                <div class="result">
                    <strong>Decrypted Text:</strong> {{ decrypted_text }}
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
